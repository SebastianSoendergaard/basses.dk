<!-- 
Description: Timer(s) that counts down from the given time in seconds. This can be used in many scenarios e.g. when doing exercises.
Features:
- Additional timers can be added (always 10 sec default) and removed to make a series of different countdowns, e.g. exercises + breaks
- Each timer's duration can be edited directly in the list; updates take effect immediately on confirm (blur/Enter)
- Timer inputs are disabled while the countdown is running or paused
- The timers run one after another; the active timer is shown in a large hero display
- The timer list with remaining times stays visible below the hero display during countdown
- The list of timers can be repeated a configurable number of times (loops)
- When each timer reaches 5 seconds it beeps on each tick: display changes 5→4, 4→3, 3→2, 2→1
- When a timer finishes (1→0) it plays a long beep
- When the full exercise (last timer in last loop) finishes, a 3-tone ascending fanfare plays
- Mobile-first layout optimised for phone use: full-width, touch-friendly buttons (min 48px)
- Dark mode with automatic OS/browser detection and a manual toggle switch
- Keep screen on mode via the Wake Lock API (toggle hidden if browser does not support it)
- Loops count, dark mode toggle, and keep-screen-on toggle share a single compact row
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequential Timer Application</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        body.dark {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: clamp(1.4rem, 5vw, 2rem);
            margin: 0 0 16px;
        }
        body.dark h1 { color: #e0e0e0; }

        .container {
            background-color: white;
            padding: 16px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            transition: background-color 0.3s;
        }
        body.dark .container { background-color: #2a2a2a; }

        /* Top-right toggles — removed, now inline with loops row */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #555;
        }
        body.dark .toggle-row { color: #aaa; }
        .toggle-row span { user-select: none; }

        /* Slide toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            border-radius: 24px;
            transition: background-color 0.3s;
        }
        .slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .switch input:checked + .slider { background-color: #4CAF50; }
        .switch input:checked + .slider::before { transform: translateX(18px); }

        /* Active countdown hero display */
        .active-display {
            text-align: center;
            margin-bottom: 16px;
            padding-top: 8px;
        }
        .active-display .active-label {
            font-size: 1rem;
            color: #666;
            margin-bottom: 4px;
        }
        body.dark .active-display .active-label { color: #aaa; }
        .active-display .active-time {
            font-size: clamp(5rem, 25vw, 9rem);
            font-weight: bold;
            line-height: 1;
            color: #4CAF50;
            letter-spacing: -2px;
        }
        .active-display .active-loop {
            font-size: 0.9rem;
            color: #888;
            margin-top: 4px;
        }
        body.dark .active-display .active-loop { color: #777; }

        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background-color: white;
            color: #333;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        body.dark input[type="number"] {
            background-color: #3a3a3a;
            color: #e0e0e0;
            border-color: #555;
        }
        /* .add-row removed — Add Timer button is now in the controls row */

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            min-height: 48px;
            touch-action: manipulation;
        }
        .btn-start { background-color: #4CAF50; color: white; }
        .btn-pause { background-color: #f39c12; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-add   { background-color: #3498db; color: white; white-space: nowrap; }

        .timers-list {
            margin-top: 16px;
        }
        .timer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            gap: 8px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        body.dark .timer-item {
            background-color: #333;
            border-color: #555;
        }
        .timer-item .input-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .timer-item .input-wrap .sec-label {
            font-size: 0.85rem;
            color: #888;
            white-space: nowrap;
        }
        body.dark .timer-item .input-wrap .sec-label { color: #777; }
        .timer-item input {
            width: 72px;
            padding: 8px 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            background-color: white;
            color: #333;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        body.dark .timer-item input {
            background-color: #3a3a3a;
            color: #e0e0e0;
            border-color: #555;
        }
        .timer-item input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .timer-item .time-display {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 64px;
            text-align: center;
        }
        .timer-item .active { color: #4CAF50; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            flex: 1;
            min-width: 80px;
            max-width: 140px;
        }

        .loops-control { margin-top: 14px; }

        .loops-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .loops-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .loops-input-wrap input[type="number"] {
            width: 64px;
            padding: 10px 8px;
            flex: none;
        }

        .status {
            margin-top: 14px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
        }

        @media (min-width: 480px) {
            .container {
                padding: 24px;
                border-radius: 10px;
                margin: 20px auto;
                min-height: unset;
                box-shadow: 0 2px 14px rgba(0,0,0,0.1);
            }
            body { padding: 0 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sequential Timer</h1>

        <!-- Active countdown hero display -->
        <div class="active-display">
            <div class="active-label" id="active-label">Ready</div>
            <div class="active-time" id="active-time">--:--</div>
            <div class="active-loop" id="active-loop"></div>
        </div>
        
        <div class="input-group loops-control">
            <div class="loops-row">
                <div class="loops-input-wrap">
                    <input type="number" id="loops" min="1" value="1">
                    <span class="sec-label">loops</span>
                </div>
                <div class="toggle-row">
                    <span title="Dark mode">🌙</span>
                    <label class="switch">
                        <input type="checkbox" id="dark-toggle" onchange="toggleDarkMode(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row" id="wake-lock-row" style="display:none;">
                    <span title="Keep screen on">📺</span>
                    <label class="switch">
                        <input type="checkbox" id="wake-lock-toggle" onchange="setWakeLockEnabled(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        
        <div class="timers-list" id="timers-list">
            <!-- Timers will be added here -->
        </div>
        
        <div class="controls">
            <button class="btn-start" onclick="startTimers()">Start</button>
            <button class="btn-pause" onclick="pauseTimers()">Pause</button>
            <button class="btn-reset" onclick="resetTimers()">Reset</button>
            <button class="btn-add" onclick="addTimer()">+ Add</button>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        let timers = [];
        let currentTimerIndex = 0;
        let currentLoop = 0;
        let totalLoops = 1;
        let isRunning = false;
        let isPaused = false;
        let intervalId = null;
        let autoResetTimeoutId = null;
        let remainingTimes = [];
        let audioCtx = null;

        // --- Wake Lock ---
        let wakeLockEnabled = false;
        let wakeLockSentinel = null;

        function setWakeLockEnabled(enabled) {
            wakeLockEnabled = enabled;
            if (!enabled) releaseWakeLock();
        }

        async function acquireWakeLock() {
            if (!wakeLockEnabled || wakeLockSentinel) return;
            try {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
            } catch (_) { /* permission denied or unsupported */ }
        }

        async function releaseWakeLock() {
            if (wakeLockSentinel) {
                await wakeLockSentinel.release();
                wakeLockSentinel = null;
            }
        }

        // Initialize audio context for beeps
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Create a beep sound
        function playBeep(duration) {
            if (!audioCtx) initAudio();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.value = 800;
            gainNode.gain.value = 0.1;
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // Play 3 ascending beeps to signal full exercise completion
        function playCompletionFanfare() {
            if (!audioCtx) initAudio();
            const frequencies = [500, 700, 950];
            const beepDuration = 0.18;
            const gap = 0.28; // seconds between beep starts
            frequencies.forEach((freq, i) => {
                const osc  = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.value = 0.12;
                const start = audioCtx.currentTime + i * gap;
                osc.start(start);
                osc.stop(start + beepDuration);
            });
        }

        // Add a new timer (always 10 seconds default)
        function addTimer() {
            timers.push(10);
            remainingTimes.push(10);
            updateTimersList();
        }

        // Remove a timer
        function removeTimer(index) {
            timers.splice(index, 1);
            remainingTimes.splice(index, 1);
            
            if (currentTimerIndex >= index) {
                currentTimerIndex--;
            }
            
            updateTimersList();
        }

        // Update the timers list display
        function updateTimersList() {
            const list = document.getElementById('timers-list');
            list.innerHTML = '';

            document.getElementById('loops').disabled = isRunning || isPaused;
            
            timers.forEach((time, index) => {
                const timerItem = document.createElement('div');
                timerItem.className = 'timer-item';
                
                const timeDisplay = document.createElement('span');
                timeDisplay.className = 'time-display';
                timeDisplay.textContent = formatTime(remainingTimes[index] || time);
                
                if (index === currentTimerIndex && isRunning && !isPaused) {
                    timeDisplay.classList.add('active');
                }
                
                const inputWrap = document.createElement('div');
                inputWrap.className = 'input-wrap';

                const input = document.createElement('input');
                input.type = 'number';
                input.min = '1';
                input.value = time;
                input.disabled = isRunning || isPaused;
                input.addEventListener('change', () => {
                    const newTime = parseInt(input.value) || 1;
                    timers[index] = newTime;
                    remainingTimes[index] = newTime;
                    timeDisplay.textContent = formatTime(newTime);
                    updateHeroDisplay();
                });

                const secLabel = document.createElement('span');
                secLabel.className = 'sec-label';
                secLabel.textContent = 'sec';

                inputWrap.appendChild(input);
                inputWrap.appendChild(secLabel);
                
                const removeBtn = document.createElement('button');
                removeBtn.textContent = 'Remove';
                removeBtn.style.backgroundColor = '#e74c3c';
                removeBtn.style.color = 'white';
                removeBtn.style.padding = '8px 12px';
                removeBtn.style.border = 'none';
                removeBtn.style.borderRadius = '4px';
                removeBtn.style.cursor = 'pointer';
                removeBtn.style.minHeight = '48px';
                removeBtn.onclick = () => removeTimer(index);
                
                timerItem.appendChild(inputWrap);
                timerItem.appendChild(timeDisplay);
                timerItem.appendChild(removeBtn);
                
                list.appendChild(timerItem);
            });

            updateHeroDisplay();
        }

        // Update the large active countdown display
        function updateHeroDisplay() {
            const timeEl  = document.getElementById('active-time');
            const labelEl = document.getElementById('active-label');
            const loopEl  = document.getElementById('active-loop');

            if (!isRunning && !isPaused) {
                if (timers.length > 0) {
                    timeEl.textContent = formatTime(remainingTimes[0] || timers[0]);
                } else {
                    timeEl.textContent = '--:--';
                }
                labelEl.textContent = 'Ready';
                loopEl.textContent  = '';
                return;
            }

            const idx = currentTimerIndex < timers.length ? currentTimerIndex : 0;
            timeEl.textContent  = formatTime(remainingTimes[idx] || 0);
            labelEl.textContent = `Timer ${idx + 1} of ${timers.length}`;
            loopEl.textContent  = totalLoops > 1 ? `Loop ${currentLoop + 1} / ${totalLoops}` : '';
        }

        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Start the timers
        function startTimers() {
            if (timers.length === 0) {
                alert('Please add at least one timer');
                return;
            }
            
            const loopsInput = document.getElementById('loops');
            totalLoops = parseInt(loopsInput.value) || 1;
            
            if (isRunning && !isPaused) return;

            clearTimeout(autoResetTimeoutId);
            initAudio();
            
            if (isPaused) {
                isPaused = false;
                document.getElementById('status').textContent = '';
                acquireWakeLock();
                intervalId = setInterval(tick, 1000);
                return;
            }
            
            isRunning = true;
            isPaused = false;
            currentLoop = 0;
            currentTimerIndex = 0;
            
            // Initialize remaining times if not already set
            if (remainingTimes.length !== timers.length) {
                remainingTimes = [...timers];
            }
            
            document.getElementById('status').textContent = '';
            updateTimersList();
            acquireWakeLock();
            intervalId = setInterval(tick, 1000);
        }

        // One tick of the countdown (called every second)
        function tick() {
            if (isPaused) return;

            // Decrement first, then evaluate the new value.
            // Beep timing:
            //   remainingTime becomes 4,3,2,1 → short beep  (display changes 5→4, 4→3, 3→2, 2→1)
            //   remainingTime becomes 0        → long beep   (display changes 1→0)
            remainingTimes[currentTimerIndex]--;

            if (remainingTimes[currentTimerIndex] <= 0) {
                playBeep(1.0); // Long beep always plays when a timer finishes (1→0)

                currentTimerIndex++;

                if (currentTimerIndex >= timers.length) {
                    currentTimerIndex = 0;
                    currentLoop++;

                    if (currentLoop >= totalLoops) {
                        clearInterval(intervalId);
                        isRunning = false;
                        document.getElementById('active-label').textContent = 'Done!';
                        document.getElementById('active-time').textContent = '00:00';
                        document.getElementById('active-loop').textContent = '';
                        document.getElementById('status').textContent = 'All loops completed!';
                        releaseWakeLock();
                        // Delay fanfare until long beep is over, then auto-reset after fanfare finishes
                        setTimeout(playCompletionFanfare, 1000);
                        autoResetTimeoutId = setTimeout(resetTimers, 1000 + 800);
                        return;
                    }

                    remainingTimes = [...timers];
                }

                // Delay start of next timer until long beep is over
                clearInterval(intervalId);
                setTimeout(() => {
                    if (isRunning && !isPaused) {
                        intervalId = setInterval(tick, 1000);
                    }
                }, 1000);
            } else if (remainingTimes[currentTimerIndex] <= 4) {
                // Short beep when display ticks 5→4, 4→3, 3→2, 2→1
                playBeep(0.2);
            }

            updateTimersList();
        }

        // Pause the timers
        function pauseTimers() {
            if (!isRunning) return;
            
            isPaused = true;
            clearInterval(intervalId);
            releaseWakeLock();
            document.getElementById('status').textContent = 'Paused';
        }

        // Reset the timers
        function resetTimers() {
            clearInterval(intervalId);
            clearTimeout(autoResetTimeoutId);
            isRunning = false;
            isPaused = false;
            currentTimerIndex = 0;
            currentLoop = 0;
            remainingTimes = [...timers];
            releaseWakeLock();
            document.getElementById('status').textContent = '';
            updateTimersList();
        }

        // Dark mode
        function toggleDarkMode(enabled) {
            document.body.classList.toggle('dark', enabled);
        }

        // Initialize with one timer
        window.onload = function() {
            // Show wake lock toggle only if the API is supported
            if ('wakeLock' in navigator) {
                document.getElementById('wake-lock-row').style.display = 'flex';
            }

            // Detect OS dark mode preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark');
                document.getElementById('dark-toggle').checked = true;
            }

            timers.push(10);
            remainingTimes.push(10);
            updateTimersList();
        };
    </script>
</body>
</html>
